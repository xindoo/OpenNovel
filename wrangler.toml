name = "opennovel"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]
main = "src/index.ts"

# Static assets - frontend build output
assets = { binding = "ASSETS", directory = "./frontend/dist", run_worker_first = true, single_page_application = true }

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "opennovel-db"
database_id = "ad0bf71a-ac52-4677-8d88-f7b3cbb890ea"
migrations_dir = "migrations"

# R2 Storage binding
[[r2_buckets]]
binding = "STORAGE"
bucket_name = "opennovel-storage"

[dev]
port = 8787

# Environment-specific configuration
# Local development
[env.development]
routes = []

# Production deployment
[env.production]
# routes = [
#   { pattern = "your-domain.com/*", custom_domain = true }
# ]
